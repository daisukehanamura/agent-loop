name: 機能追加
description: 新しい機能を追加したい
title: 'feat: '
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: 何を作るか
      description: ユーザーから見て何ができるようになるか
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: なぜ必要か
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件
      description: |
        AI に実装させる場合、ここが仕様そのものになる。テストで検証できる粒度で書く。
      placeholder: |
        - [ ] POST /api/skills でスキルを登録できる
        - [ ] 同名スキルの重複登録は 409 を返す
        - [ ] 一覧画面にロゴ付きで表示される
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 補足・制約
