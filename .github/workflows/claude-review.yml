name: Claude PR レビュー

# PR が開かれたら自動でレビューする。人間のレビュー前に機械的な指摘を潰しておく。
on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read

jobs:
  review:
    # Draft と Claude 自身が作った PR はレビューしない
    # Draft、Claude 自身の PR、bot (Dependabot) の PR はレビューしない
    if: |
      github.event.pull_request.draft == false &&
      github.actor != 'claude[bot]' &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: ANTHROPIC_API_KEY の有無を確認
        id: guard
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY が未設定のためスキップします。"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - if: steps.guard.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            この PR の差分をレビューしてください。CLAUDE.md の規約が判断基準です。
            **レビューコメントは必ず日本語で書いてください。**

            重点的に見るところ:
            - バグ・null 安全性・トランザクション境界・N+1 クエリ
            - レイヤ違反 (domain がフレームワークに依存していないか)
            - テストが振る舞いを検証しているか (実装の写経になっていないか)
            - Flyway マイグレーションが後方互換か
            - 例外が握りつぶされていないか

            指摘は「なぜ問題か」と「どう直すか」をセットで書いてください。
            問題がなければ短く承認コメントだけ残し、無理に指摘を作らないでください。
          claude_args: |
            --allowed-tools Read,Glob,Grep,Bash(git diff:*),Bash(git log:*)
          use_sticky_comment: true
