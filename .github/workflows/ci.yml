name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同じ PR で新しい push があれば古い実行は打ち切る（CI 時間とコストの節約）
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '24'

jobs:
  # 変更のあったディレクトリだけを後続ジョブで回す
  changes:
    name: 変更検出
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (Kotlin)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Gradle Wrapper の検証
        uses: gradle/actions/wrapper-validation@v6.3.0

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: フォーマット検証 (Spotless + ktlint)
        working-directory: backend
        run: ./gradlew spotlessCheck

      - name: テスト (Testcontainers で実 Postgres を使用)
        working-directory: backend
        run: ./gradlew test

      - name: カバレッジ検証 (Kover)
        working-directory: backend
        run: ./gradlew koverVerify koverXmlReport

      - name: ビルド
        working-directory: backend
        run: ./gradlew bootJar

      - name: テスト結果を保存
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/
            backend/build/reports/kover/
          retention-days: 7

  frontend:
    name: Frontend (React)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint + フォーマット検証 (Biome)
        run: npm run lint

      - name: 型チェック
        run: npm run typecheck

      - name: テスト + カバレッジ
        run: npm run test:coverage

      - name: ビルド
        run: npm run build

      - name: カバレッジを保存
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: careerdeck
          POSTGRES_USER: careerdeck
          POSTGRES_PASSWORD: careerdeck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerdeck -d careerdeck"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: true

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: バックエンドをビルドして起動
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/careerdeck
          DB_USER: careerdeck
          DB_PASSWORD: careerdeck
        run: |
          ./gradlew bootJar
          java -jar build/libs/*.jar > "$RUNNER_TEMP/backend.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "backend is up"; exit 0
            fi
            sleep 2
          done
          echo "::error::バックエンドが起動しませんでした"
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - name: フロントエンドの依存取得
        working-directory: frontend
        run: npm ci

      - name: Playwright ブラウザを取得
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E 実行
        working-directory: frontend
        run: npm run e2e

      - name: レポートを保存
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # ブランチ保護ではこのジョブだけを必須にする（paths-filter でスキップされても緑になる）
  ci-ok:
    name: CI 完了
    if: always()
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: 失敗またはキャンセルがあれば落とす
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::必須ジョブが失敗しました"
          exit 1
      - run: echo "全チェック通過"
