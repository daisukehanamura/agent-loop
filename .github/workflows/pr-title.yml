name: PR タイトル検証

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    name: Conventional Commits 準拠か
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Squash merge を使う前提。PR タイトルがそのままコミットメッセージになる
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            backend
            frontend
            ci
            docs
            deps
            ai
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            件名 "{subject}" は小文字で始めてください。
            例: feat(backend): プロフィールの AI 整形を追加
